title: Ajout d'un compte a un groupe privilegie Active Directory
id: 4f17166a-d87c-4d69-aa49-19109f798968
status: experimental
description: Un compte est ajoute a un groupe de securite privilegie du domaine (Admins du domaine, Administrateurs de l'entreprise, du schema, Administrateurs, Operateurs de compte ou de sauvegarde). Evenements 4728 (groupe global), 4732 (groupe local) et 4756 (groupe universel). Noms anglais et francais. PCI DSS 10.2.1.5 (modification des identifiants et elevation de privileges).
author: Azur Bank SOC
date: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1098/007/
  - https://learn.microsoft.com/fr-fr/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4728
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    TargetUserName:
      - Domain Admins
      - Admins du domaine
      - Enterprise Admins
      - Administrateurs de l'entreprise
      - Schema Admins
      - Administrateurs du schéma
      - Administrators
      - Administrateurs
      - Account Operators
      - Opérateurs de compte
      - Backup Operators
      - Opérateurs de sauvegarde
  condition: selection
falsepositives:
  - Ajout planifie par l'equipe AD avec un ticket de changement (verifier SubjectUserName et le ticket)
level: high
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.007
