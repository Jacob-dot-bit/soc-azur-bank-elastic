<text x="290.0" y="804.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Stable</text>
<text x="290.0" y="821.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">Fleet Server on-prem : la collecte continue même sans le cloud</text>
<text x="290.0" y="838.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">partie Cloud managée par l'éditeur (SaaS)</text>
<text x="290.0" y="854.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">agents pilotés via Fleet, aucun flux entrant depuis Internet</text>
<rect x="550" y="770" width="500" height="110" rx="6.6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.5"/>
<text x="800.0" y="804.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Scalable</text>
<text x="800.0" y="821.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">stockage et calcul autoscalés selon le volume</text>
<text x="800.0" y="838.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">nouveau site = installer l'agent + jeton d'enrôlement</text>
<text x="800.0" y="854.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">une politique par rôle, réutilisée partout</text>
<rect x="1060" y="770" width="500" height="110" rx="6.6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.5"/>
<text x="1310.0" y="804.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Conforme</text>
<text x="1310.0" y="821.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">TLS en transit, chiffrement au repos, SSO + RBAC</text>
<text x="1310.0" y="838.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">rétention 12 mois des journaux (PCI DSS 10.5.1)</text>
<text x="1310.0" y="854.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">production : région UE (RGPD, DORA)</text>
