<text x="800.0" y="964.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#263238">SOAR → fw-01 : 443 (API, blocage d'IP)  ·  SOAR → srv-dc01, db-clients-01 : 22 (confinement)  ·  bastion → Logstash : 5514 (SWIFT simulé)</text>
