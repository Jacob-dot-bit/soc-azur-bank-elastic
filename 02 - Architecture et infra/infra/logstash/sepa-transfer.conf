# Pipeline Logstash « sepa-transfer » (siem-elk-01)
# Entrée : syslog TCP 5515 du hub de paiements SEPA (simulé par infra/bastion/sim_sepa.py sur bastion-01).
# Exemple de ligne :
#   <134>1 2026-11-13T22:00:00Z sepa-hub-01 SEPA - CT_OUT - scheme=SCT_INST e2e=AZB261113220000123 client=C104512
#   debtor_iban=FR85... debtor_bic=AZURFRPPXXX creditor_iban=LT21... creditor_bic=REVOLT21XXX amount=48000.00
#   currency=EUR channel=banque_en_ligne status=ACCP
# Sortie : data stream logs-sepa.transfer-default, champs ECS + sepa.*
# Les IBAN ne sont jamais indexés en clair : seulement masqués (FR85 **** 9362) et hachés (HMAC-SHA256, clé sur site).
input {
  tcp {
    port => 5515
    host => "10.40.0.10"
    codec => line
  }
}

filter {
  # 1. En-tête syslog RFC 5424, puis corps clé=valeur du virement
  grok {
    match => { "message" => "^<%{NONNEGINT:[log][syslog][priority]}>1 %{TIMESTAMP_ISO8601:ts} %{HOSTNAME:[host][name]} %{WORD:[process][name]} - %{WORD:[event][action]} - %{GREEDYDATA:kv}$" }
    tag_on_failure => ["_sepa_grok_echec"]
  }
  kv { source => "kv" target => "sepa" remove_field => ["kv"] }
  date { match => ["ts", "ISO8601"] target => "@timestamp" remove_field => ["ts"] }

  mutate {
    convert => { "[sepa][amount]" => "float" }
    rename  => { "[sepa][client]" => "[user][name]" }
    add_field => {
      "[event][dataset]"  => "sepa.transfer"
      "[event][module]"   => "sepa"
      "[event][kind]"     => "event"
      "[event][category]" => "network"
      "[event][type]"     => "info"
      "[observer][vendor]" => "Azur Bank"
      "[observer][product]" => "Hub de paiements SEPA (simulé)"
      "[organization][name]" => "Azur Bank"
    }
  }
  if [sepa][status] == "RJCT" { mutate { add_field => { "[event][outcome]" => "failure" } } }
  else { mutate { add_field => { "[event][outcome]" => "success" } } }

  # 2. Montant en euros (le hub n'émet que de l'EUR ; un autre code devise est signalé).
  if [sepa][currency] == "EUR" { mutate { copy => { "[sepa][amount]" => "[sepa][amount_eur]" } } }
  else { mutate { add_tag => ["_sepa_devise_non_eur"] } }

  # 3. Bénéficiaire nouveau pour ce client ? Référentiel « client|IBAN » des bénéficiaires enregistrés.
  mutate { add_field => { "[@metadata][cle_benef]" => "%{[user][name]}|%{[sepa][creditor_iban]}" } }
  translate {
    source => "[@metadata][cle_benef]"
    target => "[sepa][beneficiaire_connu]"
    dictionary_path => "/etc/logstash/sepa/beneficiaires.yml"
    refresh_interval => 300
    fallback => "false"
  }
  mutate { convert => { "[sepa][beneficiaire_connu]" => "boolean" } }
  if [sepa][beneficiaire_connu] { mutate { add_field => { "[sepa][beneficiaire_nouveau]" => "false" } } }
  else { mutate { add_field => { "[sepa][beneficiaire_nouveau]" => "true" } } }
  mutate { convert => { "[sepa][beneficiaire_nouveau]" => "boolean" } }

  # 4. IBAN : empreinte HMAC-SHA256 (pour corréler sans connaître l'IBAN) et forme masquée pour l'analyste.
  fingerprint {
    source => "[sepa][creditor_iban]"
    target => "[sepa][creditor][iban_hash]"
    method => "SHA256"
    key => "${SEPA_HASH_KEY}"
  }
  ruby {
    code => '
      m = lambda { |i| i.nil? ? nil : i[0, 4] + " **** " + i[-4, 4] }
      event.set("[sepa][creditor][iban_masque]", m.call(event.get("[sepa][creditor_iban]")))
      event.set("[sepa][creditor][pays]", event.get("[sepa][creditor_iban]").to_s[0, 2])
      event.set("[sepa][debtor][iban_masque]", m.call(event.get("[sepa][debtor_iban]")))
    '
  }
  mutate {
    rename => { "[sepa][creditor_bic]" => "[sepa][creditor][bic]" "[sepa][debtor_bic]" => "[sepa][debtor][bic]" }
    remove_field => ["[sepa][creditor_iban]", "[sepa][debtor_iban]", "message", "[event][original]"]
  }

  # 5. Heure de Paris et heures ouvrées (lundi-vendredi, 7 h - 20 h), comme pour SWIFT.
  ruby {
    code => '
      require "tzinfo" rescue nil
      t = event.get("@timestamp").time
      begin
        local = TZInfo::Timezone.get("Europe/Paris").utc_to_local(t.getutc)
      rescue
        local = t.getutc + 3600
      end
      ouvre = (1..5).include?(local.wday) && local.hour >= 7 && local.hour < 20
      event.set("[sepa][heure_locale]", local.strftime("%H:%M"))
      event.set("[sepa][hors_heures_ouvrees]", !ouvre)
      event.set("[sepa][instantane]", event.get("[sepa][scheme]") == "SCT_INST")
    '
  }
}

output {
  elasticsearch {
    hosts => ["https://10.40.0.10:9200"]
    ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
    api_key => "${ES_LOGSTASH_SEPA_API_KEY}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "sepa.transfer"
    data_stream_namespace => "default"
  }
}
