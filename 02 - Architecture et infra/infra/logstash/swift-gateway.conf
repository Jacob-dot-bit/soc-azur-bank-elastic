# Pipeline Logstash « swift-gateway » (siem-elk-01)
# Entrée : syslog TCP 5514 de la passerelle SWIFT (simulée par infra/bastion/sim_swift.py sur bastion-01).
# Exemple de ligne :
#   <134>1 2026-11-06T15:40:01Z sag-01 SAG - MSG_OUT - type=MT103 ref=AZB20261106001 sender=AZURFRPPXXX
#   receiver=DEUTDEFFXXX amount=12500.00 currency=EUR operator=o.martin status=ACK
# Sortie : data stream logs-swift.gateway-default, champs ECS + swift.*
input {
  tcp {
    port => 5514
    host => "10.40.0.10"
    codec => line
  }
}

filter {
  # 1. En-tête syslog RFC 5424 : priorité, date, hôte, application, type d'événement
  grok {
    match => { "message" => "^<%{NONNEGINT:[log][syslog][priority]}>1 %{TIMESTAMP_ISO8601:ts} %{HOSTNAME:[host][name]} %{WORD:[process][name]} - %{WORD:[event][action]} - %{GREEDYDATA:kv}$" }
    tag_on_failure => ["_swift_grok_echec"]
  }
  # 2. Corps clé=valeur du message SWIFT
  kv { source => "kv" target => "swift" remove_field => ["kv"] }
  date { match => ["ts", "ISO8601"] target => "@timestamp" remove_field => ["ts"] }

  mutate {
    convert => { "[swift][amount]" => "float" }
    rename  => { "[swift][operator]" => "[user][name]" }
    copy    => { "[swift][type]" => "[swift][message_type]" }
    add_field => {
      "[event][dataset]"  => "swift.gateway"
      "[event][module]"   => "swift"
      "[event][kind]"     => "event"
      "[event][category]" => "network"
      "[observer][vendor]" => "SWIFT"
      "[observer][product]" => "Alliance Gateway (simulée)"
      "[organization][name]" => "Azur Bank"
    }
    remove_field => ["[swift][type]", "[event][original]"]
  }
  if [swift][status] == "NAK" { mutate { add_field => { "[event][outcome]" => "failure" } } }
  else { mutate { add_field => { "[event][outcome]" => "success" } } }

  # 3. Référentiel des correspondants autorisés (BIC) : tout autre destinataire est signalé.
  translate {
    source => "[swift][receiver]"
    target => "[swift][correspondant_connu]"
    dictionary => {
      "DEUTDEFFXXX" => "true"  "BNPAFRPPXXX" => "true"  "SOGEFRPPXXX" => "true"
      "COBADEFFXXX" => "true"  "INGBNL2AXXX" => "true"  "UBSWCHZH80A" => "true"
      "AZURFRPPXXX" => "true"
    }
    fallback => "false"
  }
  mutate { convert => { "[swift][correspondant_connu]" => "boolean" } }

  # 4. Enrichissement : heures ouvrées de la banque (lundi-vendredi, 7 h - 20 h, heure de Paris).
  #    C'est ce qu'apporte Logstash ici : un champ métier calculé avant l'indexation.
  ruby {
    code => '
      require "tzinfo" rescue nil
      t = event.get("@timestamp").time
      begin
        local = TZInfo::Timezone.get("Europe/Paris").utc_to_local(t.getutc)
      rescue
        local = t.getutc + 3600
      end
      ouvre = (1..5).include?(local.wday) && local.hour >= 7 && local.hour < 20
      event.set("[swift][heure_locale]", local.strftime("%H:%M"))
      event.set("[swift][hors_heures_ouvrees]", !ouvre)
    '
  }
}

output {
  elasticsearch {
    hosts => ["https://10.40.0.10:9200"]
    ssl_certificate_authorities => ["/etc/logstash/certs/http_ca.crt"]
    api_key => "${ES_LOGSTASH_API_KEY}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "swift.gateway"
    data_stream_namespace => "default"
  }
}
